<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RadMonitor — локальная карта сети</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; background: #f5f7fa; color: #222; }
  header { background: #1f2937; color: #fff; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
  h1 { margin: 0; font-size: 1.25rem; }
  .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px; background: #374151; color: #e5e7eb; font-size: 0.8rem; margin-left: 0.5rem; }
  .toolbar { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0.75rem 1.5rem; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  button { background: #2563eb; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
  button:hover { background: #1d4ed8; }
  button.secondary { background: #6b7280; }
  button.secondary:hover { background: #4b5563; }
  .poller { font-size: 0.8rem; color: #6b7280; margin-left: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; padding: 1.5rem; }
  .tile { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 1rem; cursor: pointer; transition: transform .12s, box-shadow .12s; display: flex; flex-direction: column; gap: 0.5rem; }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.08); border-color: #2563eb; }
  .tile .ip { font-weight: 700; font-size: 1.1rem; color: #111827; }
  .tile .mac { font-size: 0.85rem; color: #6b7280; font-family: ui-monospace, SFMono-Regular, monospace; }
  .tile .category { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: #6b7280; }
  .status { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 600; margin-top: 0.25rem; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; }
  .status-online .status-dot { background: #16a34a; box-shadow: 0 0 6px #16a34a; }
  .status-offline .status-dot { background: #ef4444; }
  .status-warning .status-dot { background: #ca8a04; }
  .stats { font-size: 0.8rem; color: #4b5563; margin-top: auto; border-top: 1px solid #f3f4f6; padding-top: 0.5rem; }
  .rtt { font-size: 0.8rem; font-family: ui-monospace, monospace; color: #374151; }
  .hint { font-size: 0.75rem; color: #9ca3af; font-style: italic; margin-top: 0.25rem; }
  .empty { grid-column: 1 / -1; text-align: center; color: #6b7280; padding: 3rem; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); justify-content: center; align-items: center; z-index: 50; }
  .modal.open { display: flex; }
  .modal-content { background: #fff; border-radius: 10px; width: 90%; max-width: 520px; max-height: 85vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .modal-header { padding: 1rem 1.25rem; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
  .modal-body { padding: 1.25rem; }
  .modal-close { background: transparent; border: none; font-size: 1.5rem; cursor: pointer; color: #6b7280; line-height: 1; }
  .kv { margin: 0.5rem 0; font-size: 0.9rem; }
  .kv kbd { font-weight: 700; color: #111827; }
  .kv .val { color: #4b5563; }
  .btn-open { margin-top: 1rem; background: #16a34a; }
  .btn-open:hover { background: #15803d; }
  .note { font-size: 0.8rem; color: #6b7280; margin-top: 0.5rem; border-top: 1px solid #f3f4f6; padding-top: 0.5rem; }
  .services { margin-top: 1rem; }
  .services h3 { font-size: 0.9rem; margin: 0 0 0.5rem 0; color: #374151; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #f3f4f6; padding-bottom: 0.25rem; }
  .service-list { display: flex; flex-direction: column; gap: 0.4rem; }
  .service-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; transition: background .1s; }
  .service-item:hover { background: #eff6ff; border-color: #2563eb; }
  .service-badge { display: inline-flex; align-items: center; gap: 0.25rem; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 0.15rem 0.4rem; border-radius: 4px; }
  .service-badge.http { background: #dbeafe; color: #1e40af; }
  .service-badge.https { background: #dcfce7; color: #166534; }
  .service-badge.mqtt { background: #fce7f3; color: #9d174d; }
  .service-badge.ssh { background: #fef3c7; color: #92400e; }
  .service-badge.smb { background: #e0e7ff; color: #4338ca; }
  .service-badge.rtsp { background: #fce7f3; color: #9d174d; }
  .service-badge.rdp { background: #ede9fe; color: #6d28d9; }
  .service-badge.dns { background: #ccfbf1; color: #115e59; }
  .service-badge.custom { background: #f3f4f6; color: #374151; }
  .service-info { flex: 1; min-width: 0; }
  .service-name { font-weight: 600; font-size: 0.85rem; color: #111827; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .service-desc { font-size: 0.75rem; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .service-port { font-size: 0.7rem; font-family: ui-monospace, monospace; color: #9ca3af; margin-left: auto; }
  .service-url { font-size: 0.75rem; color: #2563eb; margin-left: auto; margin-right: 0.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  .no-services { font-size: 0.8rem; color: #9ca3af; font-style: italic; margin-top: 0.5rem; }
  .conn { font-size: 0.75rem; display: flex; align-items: center; gap: 0.3rem; margin-top: 0.25rem; color: #6b7280; }
  .ips { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem; font-size: 0.78rem; }
  .ips-label { color: #6b7280; }
  .ip-chip { display: inline-flex; align-items: center; gap: 0.2rem; padding: 0.05rem 0.45rem; border-radius: 999px; border: 1px solid #e5e7eb; background: #f9fafb; color: #6b7280; font-family: ui-monospace, SFMono-Regular, monospace; }
  .ip-chip.alive { color: #166534; background: #dcfce7; border-color: #bbf7d0; }
  .ip-chip.dead { color: #991b1b; background: #fee2e2; border-color: #fecaca; }
  .ip-chip.active { outline: 2px solid #2563eb; font-weight: 700; }
  .ips-active { color: #2563eb; font-weight: 600; margin-left: auto; white-space: nowrap; }
  .conn-icon { font-size: 1rem; }
  .conn-icon.wifi { color: #2563eb; }
  .conn-icon.wired { color: #16a34a; }
  .loading { text-align: center; padding: 2rem; color: #6b7280; }

  /* Топология сети — дерево */
  #topology-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); justify-content: center; align-items: center; z-index: 100; }
  #topology-overlay.open { display: flex; }
  #topology-panel { background: #fff; border-radius: 10px; width: 95vw; height: 90vh; max-width: 1200px; max-height: 800px; box-shadow: 0 20px 60px rgba(0,0,0,.3); display: flex; flex-direction: column; overflow: hidden; position: relative; }
  #topology-header { padding: 1rem 1.25rem; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; background: #f8fafc; }
  #topology-header h3 { margin: 0; font-size: 1rem; color: #111827; }
  #topology-close { background: transparent; border: none; font-size: 1.5rem; cursor: pointer; color: #6b7280; line-height: 1; padding: 0 0.5rem; }
  #topology-tree-wrap { flex: 1; overflow: auto; background: #f3f4f6; padding: 1rem; }
  #topology-tree { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.85rem; line-height: 1.6; color: #111827; }

  .tree-node { cursor: pointer; display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0.5rem; border-radius: 6px; transition: background .15s; white-space: nowrap; }
  .tree-node:hover { background: #e5edff; }
  .tree-node.selected { background: #dbeafe; font-weight: 700; border: 1px solid #2563eb; }
  .tree-node.root { font-weight: 800; color: #111827; background: #f0fdf4; border: 1px solid #16a34a; }

  .tree-branch { position: relative; padding-left: 1.6rem; }
  .tree-branch::before { content: ''; position: absolute; left: 0.8rem; top: 0; bottom: 0; border-left: 1px solid #cbd5e1; }
  .tree-branch:last-child::before { bottom: 1.2rem; }

  .tree-conn { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.7rem; margin-left: 0.5rem; }
  .tree-conn.wired { color: #16a34a; }
  .tree-conn.wifi { color: #2563eb; }

  .tree-conn-icon { font-size: 0.8rem; }
  .tree-conn.wired .tree-conn-icon { color: #16a34a; }
  .tree-conn.wifi .tree-conn-icon { color: #2563eb; }

  .tree-status { font-size: 0.7rem; margin-left: auto; padding: 0.1rem 0.4rem; border-radius: 4px; }
  .tree-status.online { background: #dcfce7; color: #166534; }
  .tree-status.offline { background: #fee2e2; color: #991b1b; }
  .tree-status.warning { background: #fef3c7; color: #92400e; }
  .tree-status.unknown { background: #e5e7eb; color: #374151; }
  #topology-svg-wrap { flex: 1; background: #f3f4f6; overflow: auto; }
  #topology-svg { width: 100%; height: 100%; min-height: 400px; }
  #topology-legend { padding: 0.5rem 1rem; border-bottom: 1px solid #e5e7eb; display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.8rem; color: #374151; background: #fff; }
  .legend-line { display: inline-block; width: 24px; height: 3px; vertical-align: middle; margin-right: 4px; }
  .legend-line.wired { background: #16a34a; }
  .legend-line.wifi { background: #2563eb; }
  g.selected circle { stroke: #2563eb; stroke-width: 4; }
</style>
</head>
<body>
<header>
  <div>
    <h1>📡 RadMonitor — карта сети</h1>
    <div class="badge" id="subnet-badge"></div>
  </div>
  <div class="poller" id="poller-status">Готово</div>
</header>
<div class="toolbar">
  <button id="btn-refresh">Обновить сейчас</button>
  <button class="secondary" id="btn-scan">Полное сканирование</button>
  <button class="secondary" id="btn-topology">Топология сети</button>
  <div class="poller" id="alive-info">Устройств: —</div>
</div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">Устройства не найдены.</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <strong id="modal-title">Детали устройства</strong>
      <button class="modal-close" id="btn-close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <button class="btn-open" id="btn-open">Открыть веб-интерфейс устройства</button>
  </div>
</div>

<div id="topology-overlay">
  <div id="topology-panel">
    <div id="topology-header">
      <h3>Топология сети — дерево устройств</h3>
      <button id="topology-close">&times;</button>
    </div>
<div id="topology-legend"></div>
<div id="topology-svg-wrap">
  <svg id="topology-svg" width="100%" height="100%"></svg>
</div>
  </div>
</div>

<script>
const API_INFO = '/api/network/info';
const API_SCAN = '/api/network/scan';
const API_TOPOLOGY = '/api/network/topology';
const API_BASE = '';
const POLL_MS = 10000;

const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const statusEl = document.getElementById('poller-status');
const aliveEl = document.getElementById('alive-info');
const subnetBadge = document.getElementById('subnet-badge');
const btnRefresh = document.getElementById('btn-refresh');
const btnScan = document.getElementById('btn-scan');
const btnTopology = document.getElementById('btn-topology');

const topologyOverlay = document.getElementById('topology-overlay');
const topologyPanel = document.getElementById('topology-panel');
const topologyClose = document.getElementById('topology-close');
const topologySvg = document.getElementById('topology-svg');

const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modal-title');
const modalBody = document.getElementById('modal-body');
const btnClose = document.getElementById('btn-close');
const btnOpen = document.getElementById('btn-open');

let selectedDevice = null;

btnTopology.onclick = async () => {
  try {
    const r = await fetch(API_TOPOLOGY, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    drawTopology(data.devices, data.connections);
    topologyOverlay.classList.add('open');
  } catch (e) {
    setStatus('Ошибка топологии: ' + escapeHtml(e.message));
  }
};

topologyClose.onclick = () => { topologyOverlay.classList.remove('open'); };
topologyOverlay.onclick = (e) => { if (e.target === topologyOverlay) topologyOverlay.classList.remove('open'); };

function drawTopology(devices, connections) {
  const byIp = {};
  for (const d of (devices || [])) byIp[d.ip] = d;
  const svg = topologySvg;
  svg.innerHTML = '';

  const width = 1000;
  const height = 600;
  svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  const NS = 'http://www.w3.org/2000/svg';
  const adj = {};
  for (const c of (connections || [])) {
    if (!adj[c.from]) adj[c.from] = [];
    if (!adj[c.to]) adj[c.to] = [];
    adj[c.from].push(c.to);
    adj[c.to].push(c.from);
  }

  const rootIp = '192.168.1.1';
  const level = {};
  const queue = [rootIp];
  const visited = new Set([rootIp]);
  level[rootIp] = 0;
  while (queue.length) {
    const ip = queue.shift();
    for (const nb of (adj[ip] || [])) {
      if (!visited.has(nb)) { visited.add(nb); level[nb] = level[ip] + 1; queue.push(nb); }
    }
  }
  let maxLevel = 0;
  for (const v of Object.values(level)) if (v > maxLevel) maxLevel = v;
  for (const ip of Object.keys(byIp)) {
    if (level[ip] === undefined) level[ip] = maxLevel + 1;
  }

  const levels = {};
  for (const ip of Object.keys(byIp)) {
    const l = level[ip] ?? 0;
    if (!levels[l]) levels[l] = [];
    levels[l].push(ip);
  }
  const levelKeys = Object.keys(levels).map(Number).sort((a,b) => a-b);
  const pos = {};
  const yGap = 100;
  const topMargin = 60;
  levelKeys.forEach((lk, idx) => {
    const nodes = levels[lk];
    const n = nodes.length;
    const xGap = width / (n + 1);
    nodes.forEach((ip, i) => {
      pos[ip] = { x: xGap * (i + 1), y: topMargin + idx * yGap };
    });
  });

  const defs = document.createElementNS(NS, 'defs');
  function makeMarker(id, color) {
    const marker = document.createElementNS(NS, 'marker');
    marker.setAttribute('id', id);
    marker.setAttribute('markerWidth', '10');
    marker.setAttribute('markerHeight', '10');
    marker.setAttribute('refX', '24');
    marker.setAttribute('refY', '3');
    marker.setAttribute('orient', 'auto');
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', 'M0,0 L0,6 L9,3 z');
    path.setAttribute('fill', color);
    marker.appendChild(path);
    return marker;
  }
  defs.appendChild(makeMarker('arrowWired', '#16a34a'));
  defs.appendChild(makeMarker('arrowWifi', '#2563eb'));
  svg.appendChild(defs);

  for (const c of (connections || [])) {
    const from = pos[c.from], to = pos[c.to];
    if (!from || !to) continue;
    const isWifi = c.type === 'wifi';
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', from.x);
    line.setAttribute('y1', from.y);
    line.setAttribute('x2', to.x);
    line.setAttribute('y2', to.y);
    line.setAttribute('stroke', isWifi ? '#2563eb' : '#16a34a');
    line.setAttribute('stroke-width', '2');
    line.setAttribute('marker-end', isWifi ? 'url(#arrowWifi)' : 'url(#arrowWired)');
    line.style.cursor = 'pointer';
    const title = document.createElementNS(NS, 'title');
    title.textContent = c.from + ' \u2194 ' + c.to + ' (' + (isWifi ? 'Wi-Fi' : 'Ethernet') + ')';
    line.appendChild(title);
    line.addEventListener('click', () => setStatus(c.from + ' \u2194 ' + c.to + ' \u2014 ' + (isWifi ? 'Wi-Fi' : 'Ethernet')));
    svg.appendChild(line);
  }

  for (const ip of Object.keys(pos)) {
    const d = byIp[ip];
    const p = pos[ip];
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('transform', 'translate(' + p.x + ',' + p.y + ')');
    g.style.cursor = 'pointer';
    const status = d ? (d.status || 'unknown') : 'unknown';
    const color = status === 'online' ? '#16a34a' : (status === 'offline' ? '#ef4444' : (status === 'warning' ? '#ca8a04' : '#9ca3af'));
    const circle = document.createElementNS(NS, 'circle');
    circle.setAttribute('r', '22');
    circle.setAttribute('fill', '#fff');
    circle.setAttribute('stroke', color);
    circle.setAttribute('stroke-width', '3');
    g.appendChild(circle);
    const icon = document.createElementNS(NS, 'text');
    icon.setAttribute('text-anchor', 'middle');
    icon.setAttribute('dominant-baseline', 'central');
    icon.setAttribute('font-size', '16');
    icon.textContent = (ip === rootIp) ? '\ud83d\udce1' : ((d && d.connection_type === 'wifi') ? '\ud83d\udcf6' : '\ud83d\udd0c');
    g.appendChild(icon);
    const label = document.createElementNS(NS, 'text');
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('y', '38');
    label.setAttribute('font-size', '11');
    label.setAttribute('fill', '#111827');
    const name = d ? (d.name || ip) : ip;
    label.textContent = (name.length > 18) ? name.slice(0, 16) + '\u2026' : name;
    g.appendChild(label);
    const ipLabel = document.createElementNS(NS, 'text');
    ipLabel.setAttribute('text-anchor', 'middle');
    ipLabel.setAttribute('y', '52');
    ipLabel.setAttribute('font-size', '9');
    ipLabel.setAttribute('fill', '#6b7280');
    ipLabel.textContent = ip;
    g.appendChild(ipLabel);
    const title = document.createElementNS(NS, 'title');
    title.textContent = name + ' (' + ip + ') \u2014 ' + status;
    g.appendChild(title);
    g.addEventListener('click', () => {
      svg.querySelectorAll('g').forEach(n => n.classList.remove('selected'));
      g.classList.add('selected');
      setStatus(ip + ' \u2014 ' + name + ' \u00b7 ' + (d ? (d.connection_type || '\u2014') : '\u2014'));
      if (d) openDetail(d, d.detail_hint || ('http://' + ip));
    });
    svg.appendChild(g);
  }

  const legend = document.getElementById('topology-legend');
  if (legend) {
    legend.innerHTML = '<span><span class="legend-line wired"></span> \u041f\u0440\u043e\u0432\u043e\u0434 (Ethernet)</span>' +
      '<span><span class="legend-line wifi"></span> Wi-Fi</span>' +
      '<span>\u0421\u0442\u0430\u0442\u0443\u0441\u044b: <span style="color:#16a34a">\u25cf</span> online <span style="color:#ef4444">\u25cf</span> offline <span style="color:#ca8a04">\u25cf</span> warning</span>';
  }
}
function setStatus(txt) { statusEl.textContent = txt; }
function escapeHtml(t){ return String(t===''||t==null?'':t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c])); }
function escapeJs(t){ return String(t===''||t==null?'':t).replace(/['\\]/g, '\\$&'); }

function render(data) {
  grid.innerHTML = '';
  const devices = (data.devices || []).filter(d => d.status !== 'offline');
  if (!devices.length) { empty.style.display = 'block'; grid.style.display = 'none'; return; }
  empty.style.display = 'none'; grid.style.display = 'grid';

  for (const d of devices) {
    const tile = document.createElement('article');
    tile.className = 'tile status-' + (d.status || 'offline');
    const hint = d.detail_hint || ('http://' + d.ip);
    const rtt = d.ping_rtt !== null && d.ping_rtt !== undefined ? d.ping_rtt + ' ms' : '—';
    const ttl = d.ttl !== null && d.ttl !== undefined ? d.ttl : '—';
    const ports = d.ports ? (Array.isArray(d.ports) ? d.ports.join(', ') : String(d.ports)) : '—';

    let ipsRow = '';
    if (Array.isArray(d.ips) && d.ips.length > 1) {
      const chips = d.ips.map(m => {
        const cls = 'ip-chip ' + (m.alive ? 'alive' : 'dead') + (m.ip === d.active_ip ? ' active' : '');
        return '<span class="' + cls + '" title="' + escapeHtml(m.ip) + '">' +
               escapeHtml(m.ip.split('.').pop()) + (m.alive ? ' &#10003;' : ' &#10007;') + '</span>';
      }).join('');
      ipsRow = '<div class="ips"><span class="ips-label">Интерфейсы:</span>' + chips +
               '<span class="ips-active">' + (d.active_ip ? '&#9654; ' + escapeHtml(d.active_ip) : 'все офлайн') + '</span></div>';
    }
    tile.innerHTML = `
      <div class="ip">${escapeHtml(d.ip)}</div>
      ${ipsRow}
      <div class="mac">${escapeHtml(d.mac || '—')}</div>
      <div class="conn"><span class="conn-icon ${d.connection_type === 'wifi' ? 'wifi' : 'wired'}" title="${d.connection_type === 'wifi' ? 'Wi-Fi' : 'Ethernet'}">${d.connection_type === 'wifi' ? '📶' : '🔌'}</span> ${escapeHtml(d.connection_type === 'wifi' ? 'Wi-Fi' : 'Провод')}</div>
      <div class="category">${escapeHtml(d.category || '—')}</div>
      <div class="status">
        <span class="status-dot"></span>
        ${escapeHtml(d.status || 'unknown')}
      </div>
      <div class="rtt">Ping: <span>${rtt}</span> · TTL: ${ttl}</div>
      <div class="stats">Порты: ${escapeHtml(ports)}</div>
      <div class="hint">Открыть: ${escapeHtml(hint)}</div>
    `;
    tile.onclick = () => openDetail(d, hint);
    grid.appendChild(tile);
  }

  if (data.alive !== undefined && data.elapsed_sec !== undefined) {
    aliveEl.textContent = 'Найдено живых: ' + data.alive + ' из ' + data.total_hosts + ' · ' + data.elapsed_sec + ' сек';
  } else {
    aliveEl.textContent = 'Устройств: ' + devices.length + (data.alive !== undefined ? ' · живых адресов: ' + data.alive : '');
  }
  if (data.mask) subnetBadge.textContent = data.mask;
}

async function openDetail(d, hint) {
  selectedDevice = d;
  modalTitle.textContent = 'Устройство ' + escapeHtml(d.ip);
  let html = '';
  html += '<div class="kv"><kbd>IP</kbd><span class="val">' + escapeHtml(d.ip) + '</span></div>';
  if (Array.isArray(d.ips) && d.ips.length > 1) {
    const ifaceRows = d.ips.map(m => {
      const rtt = (m.ping_rtt === null || m.ping_rtt === undefined || m.ping_rtt === '-' || m.ping_rtt === '—')
        ? '' : (typeof m.ping_rtt === 'number' ? ' (' + m.ping_rtt + ' мс)' : ' (' + m.ping_rtt + ')');
      const st = m.alive ? ('online' + rtt) : 'offline';
      return escapeHtml(m.ip) + ' — ' + st + (m.ip === d.active_ip ? ' ★ активен' : '');
    }).join('<br>');
    html += '<div class="kv"><kbd>Интерфейсы</kbd><span class="val">' + ifaceRows + '</span></div>';
  }
  if (d.hostname) html += '<div class="kv"><kbd>Имя (сканер)</kbd><span class="val">' + escapeHtml(d.hostname) + '</span></div>';
  if (d.vendor) html += '<div class="kv"><kbd>Производитель</kbd><span class="val">' + escapeHtml(d.vendor) + '</span></div>';
  html += '<div class="kv"><kbd>MAC</kbd><span class="val">' + escapeHtml(d.mac || '—') + '</span></div>';
  html += '<div class="kv"><kbd>Категория</kbd><span class="val">' + escapeHtml(d.category || '—') + '</span></div>';
  html += '<div class="kv"><kbd>Статус</kbd><span class="val">' + escapeHtml(d.status || '—') + '</span></div>';
  if (d.ping_rtt !== null && d.ping_rtt !== undefined) html += '<div class="kv"><kbd>Ping RTT</kbd><span class="val">' + d.ping_rtt + ' мс</span></div>';
  if (d.ttl !== null && d.ttl !== undefined) html += '<div class="kv"><kbd>TTL</kbd><span class="val">' + d.ttl + '</span></div>';
  if (d.ports) html += '<div class="kv"><kbd>Порты</kbd><span class="val">' + escapeHtml(Array.isArray(d.ports) ? d.ports.join(', ') : String(d.ports)) + '</span></div>';
  if (d.detail_type) html += '<div class="kv"><kbd>Тип деталей</kbd><span class="val">' + escapeHtml(d.detail_type) + '</span></div>';
  if (d.detail_hint) html += '<div class="kv"><kbd>Ссылка</kbd><span class="val">' + escapeHtml(d.detail_hint) + '</span></div>';
  if (d.notes) html += '<div class="kv"><kbd>Заметки</kbd><span class="val">' + escapeHtml(d.notes) + '</span></div>';

  // Загружаем и отображаем сервисы устройства
  try {
    const r = await fetch(API_BASE + '/api/device/' + d.ip + '/services', { cache: 'no-store' });
    if (r.ok) {
      const sdata = await r.json();
      const services = sdata.services || [];
      if (services.length > 0) {
        html += '<div class="services"><h3>Сервисы (' + services.length + ')</h3><div class="service-list">';
        for (const svc of services) {
          const badgeType = svc.type || 'custom';
          const urlHtml = svc.url && (svc.type === 'http' || svc.type === 'https')
            ? '<span class="service-url" title="' + escapeHtml(svc.url) + '">' + escapeHtml(svc.url) + '</span>'
            : (svc.url ? '<span class="service-port">' + escapeHtml(svc.url) + '</span>' : '<span class="service-port">:' + svc.port + '</span>');
          html += '<div class="service-item" onclick="event.stopPropagation(); openServiceUrl(\'' + escapeJs(svc.url) + '\', \'' + escapeJs(svc.type) + '\');">';
          html += '<span class="service-badge ' + badgeType + '">' + badgeType.toUpperCase() + '</span>';
          html += '<div class="service-info"><div class="service-name" title="' + escapeHtml(svc.name) + '">' + escapeHtml(svc.name) + '</div><div class="service-desc" title="' + escapeHtml(svc.desc) + '">' + escapeHtml(svc.desc) + '</div></div>';
          html += urlHtml;
          html += '</div>';
        }
        html += '</div></div>';
      } else {
        html += '<div class="no-services">Сервисы не обнаружены</div>';
      }
    }
  } catch (e) {
    // тихо игнорируем ошибку загрузки сервисов
  }

  modalBody.innerHTML = html;
  btnOpen.onclick = () => { if (hint) window.open(hint, '_blank'); };
  modal.classList.add('open');
}

function openServiceUrl(url, type) {
  if (!url) return;
  let target = url;
  if (type === 'ssh' || type === 'rdp') {
    // для ssh/rdp просто показываем, нельзя открыть в браузере напрямую
    alert('Подключение: ' + url + '\n(используйте соответствующий клиент)');
    return;
  }
  if (type === 'smb') {
    alert('SMB ресурс: ' + url + '\n(откройте в проводнике файлов)');
    return;
  }
  if (type === 'mqtt') {
    alert('MQTT: ' + url + '\n(используйте MQTT клиент)');
    return;
  }
  if (type === 'dns' || type === 'custom') {
    alert('Адрес: ' + url);
    return;
  }
  window.open(target, '_blank');
}

function closeModal() { modal.classList.remove('open'); selectedDevice = null; }
btnClose.onclick = closeModal;
modal.onclick = (e) => { if (e.target === modal) closeModal(); };

async function fetchInfo() {
  setStatus('Обновление…');
  try {
    const r = await fetch(API_INFO, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    render(data);
    setStatus('Обновлено ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}));
  } catch (e) {
    setStatus('Ошибка: ' + escapeHtml(e.message));
  }
}

async function fullScan() {
  setStatus('Сканирование сети…');
  try {
    await fetch(API_SCAN, { method: 'GET', cache: 'no-store' });
    let scanning = true;
    while (scanning) {
      await new Promise(r => setTimeout(r, 1500));
      const r = await fetch(API_INFO, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      render(data);
      scanning = !!data.scanning;
    }
    const r = await fetch(API_INFO, { cache: 'no-store' });
    const data = await r.json();
    render(data);
    setStatus('✅ ' + (data.summary || 'готово') + ' · ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}));
  } catch (e) {
    setStatus('Ошибка сканирования: ' + escapeHtml(e.message));
  }
}

btnRefresh.onclick = fetchInfo;
btnScan.onclick = fullScan;

fullScan();
</script>
</body>
</html>
